<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Project</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #eef2ff;
      color: #172044;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(32rem, calc(100% - 2rem));
      box-sizing: border-box;
      padding: 2rem;
      border: 1px solid #dce2f5;
      border-radius: 1rem;
      background: white;
    }

    h1 {
      margin-top: 0;
    }

    p {
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to our team project</h1>
    <p>This is the starting page for our frontend.</p>
  </main>
</body>
</html>
